services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: formcast
      POSTGRES_PASSWORD: formcast
      POSTGRES_DB: formcast
    # 5433 on the host so it doesn't collide with a local Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formcast"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
